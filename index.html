<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shawarma — Freshly Wrapped</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Oswald:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e25c22' d='M16 2c1 4 2 7 0 10 4-2 8 0 8 5 0 7-5 13-8 15-3-2-8-8-8-15 0-5 4-7 8-5-2-3-1-6 0-10z'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#" aria-label="Shawarma home">
        <svg class="logo__mark" viewBox="0 0 36 44" aria-hidden="true">
          <path fill="currentColor" d="M18 1.2c.7 4.4 1.6 7.6.2 11.2 4.2-2.3 9.2-.2 9.6 5.6.5 7.8-5.2 14.7-9.8 18.8C13.6 32.7 8 25.8 7.6 18c-.3-5.8 4.6-8 8.8-5.6C15.2 8.8 16.2 5.6 18 1.2z"/>
          <rect x="16.4" y="16" width="3.2" height="26" rx="1.4" fill="currentColor"/>
        </svg>
        <span>SHAWARMA</span>
      </a>

      <nav class="nav" id="nav" aria-label="Primary">
        <a href="#" class="is-active">Menu</a>
        <a href="#">About</a>
        <a href="#">Our Story</a>
        <a href="#">Locations</a>
        <a href="#">Catering</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
        </button>
        <button class="icon-btn cart-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h15l-1.4 8.4a2 2 0 0 1-2 1.6H9.2a2 2 0 0 1-2-1.6L6 8z"/><path d="M6 8 5 4H2"/><circle cx="10" cy="20" r="1.2" fill="currentColor"/><circle cx="18" cy="20" r="1.2" fill="currentColor"/></svg>
          <span class="cart-badge">2</span>
        </button>
        <a class="btn btn--orange btn--sm" href="#">Order now <span aria-hidden="true">→</span></a>
        <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero__media" aria-hidden="true">
        <img src="Images/hero.jpg" alt="" />
      </div>
      <div class="hero__veil"></div>

      <div class="hero__content">
        <p class="eyebrow">Authentic Middle Eastern Flavor</p>
        <h1>Freshly<br />Wrapped.</h1>
        <p class="hero__tag">Good food. Real ingredients.</p>
        <div class="hero__ctas">
          <a class="btn btn--orange" href="#">Order now <span aria-hidden="true">→</span></a>
          <a class="btn btn--ghost" href="#">View menu <span aria-hidden="true">→</span></a>
        </div>
        <p class="hours"><span class="hours__dot"></span> Open today <span>11:00 — 23:00</span></p>
      </div>

      <p class="hero__note" aria-hidden="true">Real<br />Ingredients</p>

      <div class="hero__badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c.4 3.2.9 5.4.1 8 3-1.6 6.5-.1 6.8 4 .4 5.6-3.7 10.5-6.9 13.4C8.8 24.4 4.7 19.5 4.4 14c-.3-4.1 3.3-5.6 6.3-4C10 7.4 10.6 5.2 12 2z"/></svg>
        <span>Fresh ingredients<br /><strong>Bigger flavor</strong></span>
      </div>

      <div class="hero__pager">
        <button class="pager-dot is-active" aria-label="Slide 1"></button>
        <button class="pager-dot" aria-label="Slide 2"></button>
        <span class="pager-up" aria-hidden="true">↑</span>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
